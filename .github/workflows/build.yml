name: build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "josh tag to build (e.g. r26.07.19)"
        required: true
        type: string
      patch_ref:
        description: "branch in rigsmith/josh carrying the Windows port"
        required: false
        default: "windows-master"
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      patch_ref:
        required: false
        default: "windows-master"
        type: string

permissions:
  contents: read

env:
  # x86-64 Windows: aws-lc-sys needs NASM; the crate ships prebuilt NASM
  # objects behind this switch, so runners need no extra install. No effect on
  # other targets.
  AWS_LC_SYS_PREBUILT_NASM: 1

jobs:
  # Decide once whether this tag needs the Windows port, so every leg builds the
  # same tree and the release has one name.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      patched: ${{ steps.decide.outputs.patched }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        run: |
          set -euo pipefail
          status="$(ALLOW_UNPATCHED=1 scripts/prepare-source.sh '${{ inputs.tag }}' /tmp/src https://github.com/rigsmith/josh '${{ inputs.patch_ref }}')"
          echo "patched=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != patched ]; then
            # Either the port is upstream already, or it does not apply to this
            # tag: both mean unmodified source, so the plain tag names it.
            echo "release_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Patched builds get their own tag, so a plain tag never names a
            # release built from modified source. Pick the next free -win.N.
            n=1
            while gh release view "${{ inputs.tag }}-win.$n" --repo "${{ github.repository }}" >/dev/null 2>&1; do
              n=$((n + 1))
            done
            echo "release_tag=${{ inputs.tag }}-win.$n" >> "$GITHUB_OUTPUT"
          fi
      - name: Report
        run: |
          {
            echo "tag: \`${{ inputs.tag }}\`"
            echo "release: \`${{ steps.decide.outputs.release_tag }}\`"
            case "${{ steps.decide.outputs.patched }}" in
              patched)   echo "windows: port applied on top of the tag" ;;
              clean)     echo "windows: port is upstream in this tag" ;;
              unpatched) echo "⚠️ windows: the port does not apply to this tag (it is written against master), so this release carries no Windows binaries. Forward-port rigsmith/josh windows-master onto \`${{ inputs.tag }}\` if they are wanted." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,   os: ubuntu-latest,    experimental: false }
          - { target: linux-arm64, os: ubuntu-24.04-arm, experimental: false }
          - { target: macos-arm64, os: macos-latest,     experimental: false }
          - { target: macos-x64,   os: macos-15-intel,   experimental: false } # last x86_64 macOS runner
          # The frontier: upstream has no Windows CI at all. Never blocks a
          # release; a green run here is news worth posting to josh#2235.
          # continue-on-error sits on the individual steps, NOT the job: a
          # failed job with job-level continue-on-error renders a green check
          # (actions/runner#2347), hiding exactly the signal this leg exists
          # to produce. The verdict step below states the real outcomes.
          - { target: windows-x64,   os: windows-latest,  experimental: true }
          - { target: windows-arm64, os: windows-11-arm,   experimental: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # aws-lc-sys' ARM assembly is GNU-syntax, which MSVC cannot assemble: the
      # build then fails late in lib.exe, archiving objects never written.
      - name: Use clang-cl for C dependencies
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl -ErrorAction SilentlyContinue
          if ($clang) {
            Write-Host "clang-cl: $($clang.Source)"
          } else {
            Write-Host "::warning::the runner image no longer ships clang-cl; installing LLVM"
            choco install llvm -y --no-progress
            Add-Content $env:GITHUB_PATH "$env:ProgramFiles\LLVM\bin"
          }
          # cc-rs splits these on whitespace, so the bare name has to resolve on PATH.
          Add-Content $env:GITHUB_ENV "CC=clang-cl"
          Add-Content $env:GITHUB_ENV "CXX=clang-cl"

      - name: Prepare source
        run: ALLOW_UNPATCHED=1 scripts/prepare-source.sh "${{ inputs.tag }}" src https://github.com/rigsmith/josh "${{ inputs.patch_ref }}"

      - name: Build josh-proxy
        id: proxy
        continue-on-error: ${{ matrix.experimental }}
        run: cargo install --locked --path src/josh-proxy --root out

      - name: Build josh-cli
        id: cli
        continue-on-error: ${{ matrix.experimental }}
        run: cargo install --locked --path src/josh-cli --root out

      - name: Round-trip suite
        id: roundtrip
        if: steps.proxy.outcome == 'success'
        continue-on-error: ${{ matrix.experimental }}
        run: bash test/roundtrip.sh out/bin/josh-proxy*

      - name: CLI suite
        id: clisuite
        if: steps.cli.outcome == 'success'
        continue-on-error: ${{ matrix.experimental }}
        run: bash test/cli.sh out/bin

      - name: Path-forms regression (josh#2288)
        id: pathforms
        if: runner.os == 'Windows' && steps.roundtrip.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          bash test/roundtrip.sh out/bin/josh-proxy.exe "./josh-rel"
          bash test/roundtrip.sh out/bin/josh-proxy.exe "$RUNNER_TEMP/josh cache spaces"
          cmd //c "subst X: %RUNNER_TEMP%"
          bash test/roundtrip.sh out/bin/josh-proxy.exe "X:/josh-subst"
          cmd //c "subst X: /d"

      # Only a binary that passed the round-trip ships.
      - name: Stage artifacts
        if: steps.roundtrip.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir dist
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "out/bin/josh-proxy$ext" "dist/josh-proxy-${{ needs.prepare.outputs.release_tag }}-${{ matrix.target }}$ext"
          for b in josh josh-filter; do
            if [ -f "out/bin/$b$ext" ] && [ "${{ steps.clisuite.outcome }}" = "success" ]; then
              cp "out/bin/$b$ext" "dist/$b-${{ needs.prepare.outputs.release_tag }}-${{ matrix.target }}$ext"
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: steps.roundtrip.outcome == 'success'
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The loud, unmasked verdict for the experimental leg. Read outcomes
      # (pre-continue-on-error), never conclusions — conclusions lie here.
      - name: Windows verdict
        if: always() && matrix.experimental
        run: |
          {
            if [ "${{ steps.proxy.outcome }}" != "success" ]; then
              echo "❌ ${{ matrix.target }}: josh-proxy did not compile (unix-only code, e.g. josh-rpc/tokio_fd.rs at r26.07.19)"
            elif [ "${{ steps.roundtrip.outcome }}" != "success" ]; then
              echo "⚠️ ${{ matrix.target }}: josh-proxy compiled but FAILED the round-trip — not shipped"
            else
              echo "✅ ${{ matrix.target }}: josh-proxy compiled and round-tripped"
              if [ "${{ steps.pathforms.outcome }}" = "success" ]; then
                echo "✅ ${{ matrix.target }}: path-forms regression (josh#2288) passed"
              else
                echo "⚠️ ${{ matrix.target }}: path-forms regression (josh#2288) FAILED"
              fi
            fi
            if [ "${{ steps.cli.outcome }}" = "success" ]; then
              echo "✅ ${{ matrix.target }}: josh-cli canary compiled — josh#2235 news"
              if [ "${{ steps.clisuite.outcome }}" = "success" ]; then
                echo "✅ ${{ matrix.target }}: cli suite passed"
              else
                echo "⚠️ ${{ matrix.target }}: cli suite FAILED — cli binaries not shipped"
              fi
            else
              echo "· ${{ matrix.target }}: josh-cli canary still red (josh#2235)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.proxy.outcome }}" = "success" ] && [ "${{ steps.roundtrip.outcome }}" != "success" ]; then
            echo "::warning title=${{ matrix.target }} compiled but failed the round-trip::Not shipped. See the Round-trip suite step log."
          fi

  # Prove the shipped file, not the one warm in the build directory: download
  # each artifact exactly as a consumer would and rerun the suite against it.
  validate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,   os: ubuntu-latest,    experimental: false }
          - { target: linux-arm64, os: ubuntu-24.04-arm, experimental: false }
          - { target: macos-arm64, os: macos-latest,     experimental: false }
          - { target: macos-x64,   os: macos-15-intel,   experimental: false }
          - { target: windows-x64,   os: windows-latest,  experimental: true }
          - { target: windows-arm64, os: windows-11-arm,   experimental: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The windows artifact legitimately may not exist (its build or
      # round-trip failed); that must stay visible without failing the run.
      - name: Download artifact
        id: download
        continue-on-error: ${{ matrix.experimental }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist

      - name: Round-trip the shipped binary
        id: shipped
        if: steps.download.outcome == 'success'
        continue-on-error: ${{ matrix.experimental }}
        run: |
          set -euo pipefail
          bin="$(ls dist/josh-proxy-*)"
          chmod +x "$bin" # upload-artifact drops the exec bit
          bash test/roundtrip.sh "$bin"

      - name: Verdict
        if: always() && matrix.experimental
        run: |
          if [ "${{ steps.download.outcome }}" != "success" ]; then
            echo "· ${{ matrix.target }}: no artifact to validate (nothing shipped)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.shipped.outcome }}" = "success" ]; then
            echo "✅ ${{ matrix.target }}: shipped artifact round-tripped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Shipped ${{ matrix.target }} artifact failed validation::See the Round-trip step log."
            echo "⚠️ ${{ matrix.target }}: shipped artifact FAILED the round-trip" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: [prepare, build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish release
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.release_tag }}"
          src_sha=$(gh api "repos/josh-project/josh/git/ref/tags/${{ inputs.tag }}" --jq .object.sha || echo unknown)
          if [ "${{ needs.prepare.outputs.patched }}" = clean ]; then
            notes="Built from unmodified \`josh-project/josh\` tag \`${{ inputs.tag }}\` (commit \`$src_sha\`)."
          elif [ "${{ needs.prepare.outputs.patched }}" = unpatched ]; then
            notes="Built from unmodified \`josh-project/josh\` tag \`${{ inputs.tag }}\` (commit \`$src_sha\`). No Windows binaries: the Windows port is written against master and does not apply to this tag."
          else
            port_sha=$(gh api "repos/rigsmith/josh/commits/${{ inputs.patch_ref }}" --jq .sha || echo unknown)
            notes="Built from \`josh-project/josh\` tag \`${{ inputs.tag }}\` (commit \`$src_sha\`) with the Windows port from \`rigsmith/josh\` \`${{ inputs.patch_ref }}\` (commit \`$port_sha\`) applied. That port is proposed upstream as josh-project/josh#2512; once it lands, tags build unmodified and this suffix retires."
          fi
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "$notes Each binary passed the functional suites on its platform. Verify: \`gh attestation verify <file> --repo ${{ github.repository }}\` and \`sha256sum -c SHA256SUMS\`."
